<!-- The card a stranger sees. Nobody finds this page — robots are told to stay away, above, and
     that stays true. But the Circle is joined by someone already in pasting the link into a
     chat, Aruba is WhatsApp-first, and until now that paste unfurled with an empty picture box.
     So: the name, the seat count, and nothing else. No prices, no member names, no coverage
     figure, and no photograph of a member — that is all inside the Circle, and the last of it is
     a house rule. The count is the cap (money.js memberCap), not a headcount: forty is a rule
     the club set, not a claim about who has turned up. -->
