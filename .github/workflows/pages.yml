name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Stamp the service worker's cache name with this commit.
      #
      # The cache name is the ONLY thing that evicts a browser's stored copy of the app. It was
      # bumped by hand, which means it was not bumped: it sat at 'hunto-v10' across a run of
      # releases, so anyone who had opened the site before kept being served the old hero, the
      # old stylesheet and the old JavaScript, and every change shipped in that time was
      # invisible to them. Doing it here means a deploy cannot forget.
      - name: Stamp the service worker with this commit
        run: |
          set -euo pipefail
          sed -i "s/^const VERSION = '[^']*';/const VERSION = 'hunto-${GITHUB_SHA:0:12}';/" circle/sw.js
          grep -q "hunto-${GITHUB_SHA:0:12}" circle/sw.js \
            || { echo "::error::sw.js cache version was not stamped — browsers would keep serving the old app"; exit 1; }
          grep -n "^const VERSION" circle/sw.js

      # The Circle's own copy of what is open on VakayMood (see open-weeks.yml). Taken here too, so
      # a code deploy carries a fresh copy rather than whatever was committed. If VakayMood is
      # down the deploy still goes out: the page handles a missing or stale copy.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Take the open-weeks copy
        continue-on-error: true
        run: node circle/scripts/open-weeks.mjs

      # Publish the app, not the repository.
      #
      # `path: "."` served the whole checkout, so victorfromaruba-stack.github.io was handing out
      # circle/watcher/interval.mjs and redweek.mjs — scraping code for two login-gated sites,
      # bot-management handling and all — circle/supabase/schema.sql, which is 196KB describing
      # every policy, function and guard the club has, and .claude/ with the internal instructions.
      #
      # Chrome flagged the site as malicious and this is the likeliest reason. To a crawler the
      # site read as a credential form on a free host, sitting beside JavaScript that injects into
      # and scrapes a third-party login page. That is the fingerprint of a phishing kit, and it is
      # a fair reading of what was actually published.
      #
      # Deleted from the CHECKOUT rather than by moving the publish root, so every URL that exists
      # today still resolves: the app, tools/grab.js (the Desk's bookmarklet loads it by URL at
      # officer.js:415) and tools/check-interval.ics (a subscribed calendar) are untouched. Nothing
      # removed here is fetched by the app — verified against every path it imports.
      - name: Leave the private half of the repo out of the artifact
        run: |
          set -euo pipefail
          rm -rf circle/watcher circle/supabase circle/scripts .claude .github
          rm -f README.md circle/README.md
          for must in circle/index.html circle/js/app.js circle/tools/grab.js \
                      circle/tools/check-interval.ics circle/data/open-weeks.json circle/sw.js; do
            test -e "$must" || { echo "::error::$must was removed and the app needs it"; exit 1; }
          done
          for gone in circle/watcher circle/supabase .claude; do
            test ! -e "$gone" || { echo "::error::$gone is still in the artifact"; exit 1; }
          done

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
